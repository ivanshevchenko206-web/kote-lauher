name: Build KoteLauncher

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install minecraft-launcher-lib pyinstaller
      - run: python -m PyInstaller --onefile --windowed --name KoteLauncher launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: KoteLauncher
          path: dist/KoteLauncher.exe
